<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Multi-agent tracing</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1200" height="540" fill="#FFFFFF"/>
<text x="40" y="36" font-size="13" fill="#1F2937"  font-weight="400">Concurrent sessions are isolated by session_id and attributed to an agent identity; events inside a session are linked by correlation_id and OpenTelemetry trace/span ids.</text>
<rect x="40" y="56" width="1120" height="96" rx="10" fill="#FFFFFF" stroke="#CBD2DC"/><rect x="40" y="56" width="6" height="96" rx="3" fill="#2A78D6"/><text x="60" y="80" font-size="13.5" fill="#0B1F3A"  font-weight="650">Claude Code@host · session 7f2a… (hooks + OTLP)</text><rect x="80" y="108" width="132" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="90" y="127" font-size="12" fill="#1F2937"  font-weight="400">PreToolUse: Bash</text><text x="80" y="102" font-size="10.5" fill="#5B6472"  font-weight="400">tool_use_id=tu_1</text><rect x="300" y="108" width="97" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="310" y="127" font-size="12" fill="#1F2937"  font-weight="400">tool_result</text><text x="300" y="102" font-size="10.5" fill="#5B6472"  font-weight="400">tool_use_id=tu_1</text><rect x="470" y="108" width="125" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="480" y="127" font-size="12" fill="#1F2937"  font-weight="400">mcp_call github</text><rect x="650" y="108" width="363" height="30" rx="7" fill="#FCEDEC" stroke="#B42318"/><text x="660" y="127" font-size="12" fill="#B42318"  font-weight="400">security_detection: Download piped to interpreter</text><text x="650" y="102" font-size="10.5" fill="#5B6472"  font-weight="400">correlation_id → triggering event</text>
<rect x="40" y="164" width="1120" height="96" rx="10" fill="#FFFFFF" stroke="#CBD2DC"/><rect x="40" y="164" width="6" height="96" rx="3" fill="#EB6834"/><text x="60" y="188" font-size="13.5" fill="#0B1F3A"  font-weight="650">Cursor@host · conversation c91… (hooks)</text><rect x="80" y="216" width="160" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="90" y="235" font-size="12" fill="#1F2937"  font-weight="400">beforeShellExecution</text><rect x="300" y="216" width="188" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="310" y="235" font-size="12" fill="#1F2937"  font-weight="400">afterFileEdit src/app.ts</text><rect x="560" y="216" width="146" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="570" y="235" font-size="12" fill="#1F2937"  font-weight="400">beforeMCPExecution</text>
<rect x="40" y="272" width="1120" height="96" rx="10" fill="#FFFFFF" stroke="#CBD2DC"/><rect x="40" y="272" width="6" height="96" rx="3" fill="#1BAF7A"/><text x="60" y="296" font-size="13.5" fill="#0B1F3A"  font-weight="650">Codex@host · conversation 4be… (OTLP)</text><rect x="80" y="324" width="195" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="90" y="343" font-size="12" fill="#1F2937"  font-weight="400">user_prompt (length only)</text><rect x="330" y="324" width="188" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="340" y="343" font-size="12" fill="#1F2937"  font-weight="400">tool_result exec_command</text><text x="330" y="318" font-size="10.5" fill="#5B6472"  font-weight="400">duration_ms=820</text><rect x="590" y="324" width="97" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="600" y="343" font-size="12" fill="#1F2937"  font-weight="400">api_request</text>
<rect x="40" y="380" width="1120" height="96" rx="10" fill="#FFFFFF" stroke="#CBD2DC"/><rect x="40" y="380" width="6" height="96" rx="3" fill="#6B7280"/><text x="60" y="404" font-size="13.5" fill="#0B1F3A"  font-weight="650">Node agent@host · proc:node-agent:&lt;pid&gt; (process snapshots)</text><rect x="80" y="432" width="125" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="90" y="451" font-size="12" fill="#1F2937"  font-weight="400">session_started</text><rect x="240" y="432" width="237" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="250" y="451" font-size="12" fill="#1F2937"  font-weight="400">process_started web_search_tool</text><rect x="520" y="432" width="139" height="30" rx="7" fill="#F3F5F8" stroke="#CBD2DC"/><text x="530" y="451" font-size="12" fill="#1F2937"  font-weight="400">command_execution</text><text x="520" y="426" font-size="10.5" fill="#5B6472"  font-weight="400">descendant pid</text>
<text x="40" y="510" font-size="12.5" fill="#5B6472"  font-weight="400">Many instances of one product → one agent_id, many session_ids. Hook, OTLP and process reports of the same action are de-duplicated before storage.</text>
</svg>