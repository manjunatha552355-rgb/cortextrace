<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Risk analysis flow</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1200" height="430" fill="#FFFFFF"/>
<rect x="30" y="60" width="190" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="44" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Detections</text><text x="44" y="104" font-size="12" fill="#5B6472">for a session (all)</text><text x="44" y="121" font-size="12" fill="#5B6472">or agent (last 24 h)</text>
<rect x="250" y="60" width="250" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="264" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Points per detection</text><text x="264" y="104" font-size="12" fill="#5B6472">severity points:</text><text x="264" y="121" font-size="12" fill="#5B6472">INFO 0 · LOW 6 · MEDIUM 18</text><text x="264" y="138" font-size="12" fill="#5B6472">HIGH 40 · CRITICAL 75</text><text x="264" y="155" font-size="12" fill="#5B6472">× confidence × class weight</text>
<rect x="530" y="60" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="544" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Repeat control</text><text x="544" y="104" font-size="12" fill="#5B6472">same rule repeats</text><text x="544" y="121" font-size="12" fill="#5B6472">count at 25 %</text><text x="544" y="138" font-size="12" fill="#5B6472">max 3 repeats</text>
<rect x="760" y="60" width="200" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="774" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Rank decay</text><text x="774" y="104" font-size="12" fill="#5B6472">sort by points</text><text x="774" y="121" font-size="12" fill="#5B6472">score = Σ pᵢ × 0.7^rank</text><text x="774" y="138" font-size="12" fill="#5B6472">capped at 100</text>
<rect x="990" y="60" width="180" height="130" rx="10" fill="#E6EEF8" stroke="#1F5FAF" stroke-width="1.4"/><text x="1004" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Level</text><text x="1004" y="104" font-size="12" fill="#5B6472">low ≥ 15 · medium ≥ 40</text><text x="1004" y="121" font-size="12" fill="#5B6472">high ≥ 65 · critical ≥ 85</text><text x="1004" y="138" font-size="12" fill="#5B6472">(configurable)</text>
<path d="M220,125  L250,125" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M500,125  L530,125" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M730,125  L760,125" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M960,125  L990,125" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<rect x="30" y="220" width="1140" height="190" rx="14" fill="#F3F5F8"/><text x="46" y="244" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">EXPLANATION STORED WITH THE SCORE</text>
<rect x="50" y="260" width="350" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="64" y="284" font-size="14" font-weight="650" fill="#0B1F3A">Per-dimension scores</text><text x="64" y="304" font-size="12" fill="#5B6472">command · filesystem · network · credential</text><text x="64" y="321" font-size="12" fill="#5B6472">privilege · persistence · data access</text><text x="64" y="338" font-size="12" fill="#5B6472">MCP / tool · anomaly · policy</text><text x="64" y="355" font-size="12" fill="#5B6472">(same formula per dimension)</text>
<rect x="425" y="260" width="350" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="439" y="284" font-size="14" font-weight="650" fill="#0B1F3A">Contributing factors</text><text x="439" y="304" font-size="12" fill="#5B6472">rule name · severity · classification</text><text x="439" y="321" font-size="12" fill="#5B6472">confidence · points · evidence snippet</text><text x="439" y="338" font-size="12" fill="#5B6472">linked to the detection and event</text>
<rect x="800" y="260" width="350" height="130" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="814" y="284" font-size="14" font-weight="650" fill="#0B1F3A">Class weights</text><text x="814" y="304" font-size="12" fill="#5B6472">observation × 0.5</text><text x="814" y="321" font-size="12" fill="#5B6472">suspicious indicator × 1.0</text><text x="814" y="338" font-size="12" fill="#5B6472">policy violation × 1.2</text>
</svg>