<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Agent discovery flow</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1200" height="560" fill="#FFFFFF"/>
<rect x="20" y="20" width="1160" height="150" rx="14" fill="#F3F5F8"/><text x="36" y="44" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">PROCESS-BASED DISCOVERY (EVERY 5 S, UNPRIVILEGED)</text>
<rect x="40" y="60" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Process snapshot</text><text x="54" y="104" font-size="12" fill="#5B6472">pid · ppid · executable</text><text x="54" y="121" font-size="12" fill="#5B6472">command line · start time</text>
<rect x="270" y="60" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="284" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Signature match</text><text x="284" y="104" font-size="12" fill="#5B6472">executable name / path</text><text x="284" y="121" font-size="12" fill="#5B6472">command line + interpreter</text><text x="284" y="138" font-size="12" fill="#5B6472">(Chromium --type helpers skipped)</text>
<rect x="530" y="60" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="544" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Root selection</text><text x="544" y="104" font-size="12" fill="#5B6472">no ancestor of the</text><text x="544" y="121" font-size="12" fill="#5B6472">same agent → root</text>
<rect x="760" y="60" width="200" height="90" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="774" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Session</text><text x="774" y="104" font-size="12" fill="#5B6472">proc:&lt;agent&gt;:&lt;pid&gt;:&lt;start&gt;</text><text x="774" y="121" font-size="12" fill="#5B6472">agent_started / session_started</text>
<rect x="990" y="60" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="1004" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Descendants</text><text x="1004" y="104" font-size="12" fill="#5B6472">child processes →</text><text x="1004" y="121" font-size="12" fill="#5B6472">command events</text>
<path d="M240,105  L270,105" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M500,105  L530,105" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M730,105  L760,105" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M960,105  L990,105" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<rect x="20" y="190" width="570" height="170" rx="14" fill="#F3F5F8"/><text x="36" y="214" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">INSTALLED-AGENT DISCOVERY (STARTUP + EVERY 60 S)</text>
<rect x="40" y="230" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="254" font-size="14" font-weight="650" fill="#0B1F3A">Known locations</text><text x="54" y="274" font-size="12" fill="#5B6472">~/.claude, ~/.cursor, ~/.codex, ~/.gemini,</text><text x="54" y="291" font-size="12" fill="#5B6472">VS Code extensions, app bundles …</text><text x="54" y="308" font-size="12" fill="#5B6472">MCP config files (names only)</text>
<rect x="320" y="230" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="334" y="254" font-size="14" font-weight="650" fill="#0B1F3A">Inventory</text><text x="334" y="274" font-size="12" fill="#5B6472">agent marked installed</text><text x="334" y="291" font-size="12" fill="#5B6472">install paths + capabilities</text><text x="334" y="308" font-size="12" fill="#5B6472">MCP servers → known-server list</text>
<path d="M290,285  L320,285" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<rect x="610" y="190" width="570" height="170" rx="14" fill="#F3F5F8"/><text x="626" y="214" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">DYNAMIC DISCOVERY (EVERY 60 S)</text>
<rect x="630" y="230" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="644" y="254" font-size="14" font-weight="650" fill="#0B1F3A">LLM API resolution</text><text x="644" y="274" font-size="12" fill="#5B6472">DNS for known LLM API hosts</text><text x="644" y="291" font-size="12" fill="#5B6472">(api.anthropic.com, api.openai.com …)</text>
<rect x="910" y="230" width="250" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="924" y="254" font-size="14" font-weight="650" fill="#0B1F3A">Connection match</text><text x="924" y="274" font-size="12" fill="#5B6472">interpreter/container process</text><text x="924" y="291" font-size="12" fill="#5B6472">connected to those IPs →</text><text x="924" y="308" font-size="12" fill="#5B6472">"LLM client" (inferred)</text>
<path d="M880,285  L910,285" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<rect x="20" y="380" width="1160" height="160" rx="14" fill="#F3F5F8"/><text x="36" y="404" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">RUNTIME-REPORTED IDENTITY</text>
<rect x="40" y="420" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="444" font-size="14" font-weight="650" fill="#0B1F3A">Hook payload</text><text x="54" y="464" font-size="12" fill="#5B6472">POST /v1/hooks/&lt;adapter&gt;/&lt;event&gt;</text><text x="54" y="481" font-size="12" fill="#5B6472">adapter from URL, session_id / cwd</text><text x="54" y="498" font-size="12" fill="#5B6472">from payload</text>
<rect x="340" y="420" width="270" height="100" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="354" y="444" font-size="14" font-weight="650" fill="#0B1F3A">OTLP resource</text><text x="354" y="464" font-size="12" fill="#5B6472">service.name → adapter</text><text x="354" y="481" font-size="12" fill="#5B6472">(claude-code, codex_cli_rs, gemini-cli)</text><text x="354" y="498" font-size="12" fill="#5B6472">unknown → otel.&lt;service&gt;</text>
<rect x="640" y="420" width="250" height="100" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="654" y="444" font-size="14" font-weight="650" fill="#0B1F3A">Custom agents</text><text x="654" y="464" font-size="12" fill="#5B6472">process names / command-line regex</text><text x="654" y="481" font-size="12" fill="#5B6472">event-name mappings</text><text x="654" y="498" font-size="12" fill="#5B6472">per-agent policies</text>
<rect x="920" y="420" width="240" height="100" rx="10" fill="#E6EEF8" stroke="#1F5FAF" stroke-width="1.4"/><text x="934" y="444" font-size="14" font-weight="650" fill="#0B1F3A">Agent identity</text><text x="934" y="464" font-size="12" fill="#5B6472">agent_id = &lt;adapter&gt;@&lt;host_id&gt;</text><text x="934" y="481" font-size="12" fill="#5B6472">one identity per product per host</text><text x="934" y="498" font-size="12" fill="#5B6472">many concurrent sessions</text>
<path d="M310,470  L340,470" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M610,470  L640,470" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M890,470  L920,470" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
</svg>