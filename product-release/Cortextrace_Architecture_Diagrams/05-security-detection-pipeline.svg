<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Security detection pipeline</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1200" height="560" fill="#FFFFFF"/>
<rect x="30" y="230" width="150" height="90" rx="10" fill="#E6EEF8" stroke="#1F5FAF" stroke-width="1.4"/><text x="44" y="254" font-size="14" font-weight="650" fill="#0B1F3A">Normalised event</text><text x="44" y="274" font-size="12" fill="#5B6472">redacted, validated</text>
<rect x="210" y="20" width="470" height="520" rx="14" fill="#F3F5F8"/><text x="226" y="44" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">DETECTION LAYERS (PER EVENT)</text>
<rect x="230" y="60" width="430" height="80" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="244" y="84" font-size="14" font-weight="650" fill="#0B1F3A">1 · Deterministic rules (39)</text><text x="244" y="104" font-size="12" fill="#5B6472">regex on command, path, host, prompt, tool output, arguments</text><text x="244" y="121" font-size="12" fill="#5B6472">each rule tested with match / no-match examples</text>
<rect x="230" y="155" width="430" height="60" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="244" y="179" font-size="14" font-weight="650" fill="#0B1F3A">Secret exposure</text><text x="244" y="199" font-size="12" fill="#5B6472">secret formats found by redaction (values never stored)</text>
<rect x="230" y="230" width="430" height="80" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="244" y="254" font-size="14" font-weight="650" fill="#0B1F3A">2 · Policies (user-defined)</text><text x="244" y="274" font-size="12" fill="#5B6472">observe → observation · alert → policy violation</text><text x="244" y="291" font-size="12" fill="#5B6472">require_approval → synchronous "ask" to supporting hooks</text>
<rect x="230" y="325" width="430" height="80" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="244" y="349" font-size="14" font-weight="650" fill="#0B1F3A">3 · Stateful heuristics (per session)</text><text x="244" y="369" font-size="12" fill="#5B6472">mass file changes/deletions · large repository change</text><text x="244" y="386" font-size="12" fill="#5B6472">credential access → egress (120 s) · denied → executed</text>
<rect x="230" y="420" width="430" height="100" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="244" y="444" font-size="14" font-weight="650" fill="#0B1F3A">4 · Anomaly &amp; first-seen</text><text x="244" y="464" font-size="12" fill="#5B6472">events/minute vs EWMA baseline (z ≥ 4, n ≥ 30)</text><text x="244" y="481" font-size="12" fill="#5B6472">first non-allowlisted destination per agent type</text><text x="244" y="498" font-size="12" fill="#5B6472">first call to an unconfigured MCP server</text>
<path d="M180,275  L230,100" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M180,275  L230,185" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M180,275  L230,270" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M180,275  L230,365" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M180,275  L230,470" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<rect x="720" y="170" width="200" height="210" rx="10" fill="#FFFFFF" stroke="#1F5FAF" stroke-width="1.4"/><text x="734" y="194" font-size="14" font-weight="650" fill="#0B1F3A">Detection</text><text x="734" y="214" font-size="12" fill="#5B6472">rule id &amp; name</text><text x="734" y="231" font-size="12" fill="#5B6472">classification</text><text x="734" y="248" font-size="12" fill="#5B6472">severity · confidence</text><text x="734" y="265" font-size="12" fill="#5B6472">risk dimension</text><text x="734" y="282" font-size="12" fill="#5B6472">reason · evidence</text><text x="734" y="299" font-size="12" fill="#5B6472">recommended action</text><text x="734" y="316" font-size="12" fill="#5B6472">related event ids</text>
<path d="M660,100  L720,230" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M660,185  L720,245" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M660,270  L720,275" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M660,365  L720,305" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M660,470  L720,330" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<rect x="960" y="40" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="974" y="64" font-size="14" font-weight="650" fill="#0B1F3A">Timeline event</text><text x="974" y="84" font-size="12" fill="#5B6472">security_detection /</text><text x="974" y="101" font-size="12" fill="#5B6472">policy_violation linked to</text><text x="974" y="118" font-size="12" fill="#5B6472">the triggering event</text>
<rect x="960" y="175" width="210" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="974" y="199" font-size="14" font-weight="650" fill="#0B1F3A">Risk engine</text><text x="974" y="219" font-size="12" fill="#5B6472">session risk (all time)</text><text x="974" y="236" font-size="12" fill="#5B6472">agent risk (24 h)</text><text x="974" y="253" font-size="12" fill="#5B6472">per dimension</text>
<rect x="960" y="310" width="210" height="210" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="974" y="334" font-size="14" font-weight="650" fill="#0B1F3A">Alerts</text><text x="974" y="354" font-size="12" fill="#5B6472">≥ MEDIUM (configurable)</text><text x="974" y="371" font-size="12" fill="#5B6472">dedupe: rule + session +</text><text x="974" y="388" font-size="12" fill="#5B6472">normalised evidence</text><text x="974" y="405" font-size="12" fill="#5B6472">incidents: same session ≤ 30 min</text><text x="974" y="422" font-size="12" fill="#5B6472">suppressions</text><text x="974" y="439" font-size="12" fill="#5B6472">→ desktop (≥ HIGH), alerts.jsonl,</text><text x="974" y="456" font-size="12" fill="#5B6472">   optional webhook</text>
<path d="M920,230  L960,95" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<path d="M920,275  L960,230" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<path d="M920,320  L960,415" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<rect x="740" y="420" width="92.8" height="22" rx="11" fill="#F3F5F8"/><text x="786.4" y="435" font-size="11.5" font-weight="650" fill="#5B6472" text-anchor="middle">observation</text>
<rect x="740" y="450" width="154" height="22" rx="11" fill="#FDF3E6"/><text x="817" y="465" font-size="11.5" font-weight="650" fill="#B45309" text-anchor="middle">suspicious indicator</text>
<rect x="740" y="480" width="126.8" height="22" rx="11" fill="#FCEDEC"/><text x="803.4" y="495" font-size="11.5" font-weight="650" fill="#B42318" text-anchor="middle">policy violation</text>
</svg>