<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Event ingestion pipeline</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1280" height="360" fill="#FFFFFF"/>
<rect x="20" y="20" width="1240" height="320" rx="14" fill="#F3F5F8"/><text x="36" y="44" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">EVENT PIPELINE (SRC/CORE/ENGINE.TS)</text>
<rect x="36" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="50" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Enqueue</text><text x="50" y="114" font-size="12" fill="#5B6472">bounded queue</text><text x="50" y="131" font-size="12" fill="#5B6472">≤ 50,000 events</text><text x="50" y="148" font-size="12" fill="#5B6472">overflow is</text><text x="50" y="165" font-size="12" fill="#5B6472">dropped &amp; counted</text>
<rect x="158" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="172" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Batch</text><text x="172" y="114" font-size="12" fill="#5B6472">≤ 1,000 events</text><text x="172" y="131" font-size="12" fill="#5B6472">or every 200 ms</text>
<rect x="280" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="294" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Identify</text><text x="294" y="114" font-size="12" fill="#5B6472">agent id</text><text x="294" y="131" font-size="12" fill="#5B6472">session id</text><text x="294" y="148" font-size="12" fill="#5B6472">workspace</text>
<rect x="402" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="416" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Redact</text><text x="416" y="114" font-size="12" fill="#5B6472">secret formats</text><text x="416" y="131" font-size="12" fill="#5B6472">sensitive keys</text><text x="416" y="148" font-size="12" fill="#5B6472">4 KB string cap</text>
<rect x="524" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="538" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Validate</text><text x="538" y="114" font-size="12" fill="#5B6472">schema v1 (zod)</text><text x="538" y="131" font-size="12" fill="#5B6472">invalid events</text><text x="538" y="148" font-size="12" fill="#5B6472">dropped &amp; counted</text>
<rect x="646" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="660" y="94" font-size="13" font-weight="650" fill="#0B1F3A">De-duplicate</text><text x="660" y="114" font-size="12" fill="#5B6472">hook vs OTLP</text><text x="660" y="131" font-size="12" fill="#5B6472">hook vs process</text><text x="660" y="148" font-size="12" fill="#5B6472">hook vs file watch</text>
<rect x="768" y="70" width="108" height="150" rx="10" fill="#E6EEF8" stroke="#1F5FAF" stroke-width="1.4"/><text x="782" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Detect</text><text x="782" y="114" font-size="12" fill="#5B6472">rules</text><text x="782" y="131" font-size="12" fill="#5B6472">policies</text><text x="782" y="148" font-size="12" fill="#5B6472">heuristics</text><text x="782" y="165" font-size="12" fill="#5B6472">anomaly</text>
<rect x="890" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="904" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Minimise</text><text x="904" y="114" font-size="12" fill="#5B6472">prompts: metadata</text><text x="904" y="131" font-size="12" fill="#5B6472">tool output:</text><text x="904" y="148" font-size="12" fill="#5B6472">length only</text><text x="904" y="165" font-size="12" fill="#5B6472">(configurable)</text>
<rect x="1012" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="1026" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Persist</text><text x="1026" y="114" font-size="12" fill="#5B6472">one SQLite</text><text x="1026" y="131" font-size="12" fill="#5B6472">transaction</text><text x="1026" y="148" font-size="12" fill="#5B6472">risk + alerts</text>
<rect x="1134" y="70" width="108" height="150" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="1148" y="94" font-size="13" font-weight="650" fill="#0B1F3A">Stream</text><text x="1148" y="114" font-size="12" fill="#5B6472">to the UI</text><text x="1148" y="131" font-size="12" fill="#5B6472">≤ 1,000 events</text><text x="1148" y="148" font-size="12" fill="#5B6472">per 500 ms</text>
<path d="M145,145  L157,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M267,145  L279,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M389,145  L401,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M511,145  L523,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M633,145  L645,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M755,145  L767,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M877,145  L889,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M999,145  L1011,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M1121,145  L1133,145" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<text x="36" y="270" font-size="12.5" fill="#1F2937"  font-weight="400">Sources: hooks, OTLP and REST API (processed within one batch interval) · process snapshots every 5 s · connection tables every 10 s · file watch (event-driven, 300 ms debounce)</text>
<text x="36" y="300" font-size="12.5" fill="#5B6472"  font-weight="400">Self-metrics recorded along the way: received, stored, dropped, de-duplicated, invalid, batch latency p50/p95.</text>
</svg>