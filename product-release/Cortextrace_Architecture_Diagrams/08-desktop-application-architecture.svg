<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title>Desktop application architecture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A93A3"/></marker>
<marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F5FAF"/></marker></defs>
<rect width="1200" height="560" fill="#FFFFFF"/>
<rect x="20" y="20" width="740" height="520" rx="14" fill="#F3F5F8"/><text x="36" y="44" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">ELECTRON MAIN PROCESS (NODE 24)</text>
<rect x="40" y="60" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Runtime</text><text x="54" y="104" font-size="12" fill="#5B6472">Engine (pipeline, detection, storage)</text><text x="54" y="121" font-size="12" fill="#5B6472">Collector supervisor</text><text x="54" y="138" font-size="12" fill="#5B6472">API server 127.0.0.1:47631</text><text x="54" y="155" font-size="12" fill="#5B6472">OTLP receiver 127.0.0.1:4318</text>
<rect x="400" y="60" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="414" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Desktop shell</text><text x="414" y="104" font-size="12" fill="#5B6472">single-instance lock · tray menu</text><text x="414" y="121" font-size="12" fill="#5B6472">notifications (≥ HIGH) · start at login</text><text x="414" y="138" font-size="12" fill="#5B6472">close-to-tray · pause / resume</text>
<rect x="40" y="195" width="700" height="90" rx="10" fill="#FFFFFF" stroke="#1F5FAF" stroke-width="1.4"/><text x="54" y="219" font-size="14" font-weight="650" fill="#0B1F3A">IPC gateway</text><text x="54" y="239" font-size="12" fill="#5B6472">allow-listed channels · argument validation · sender URL check</text><text x="54" y="256" font-size="12" fill="#5B6472">stream coalescing (≤ 1,000 events / 500 ms, only while window visible)</text>
<rect x="40" y="310" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="334" font-size="14" font-weight="650" fill="#0B1F3A">Window hardening</text><text x="54" y="354" font-size="12" fill="#5B6472">contextIsolation · sandbox</text><text x="54" y="371" font-size="12" fill="#5B6472">nodeIntegration off · navigation blocked</text><text x="54" y="388" font-size="12" fill="#5B6472">all permission requests denied</text>
<rect x="400" y="310" width="340" height="110" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="414" y="334" font-size="14" font-weight="650" fill="#0B1F3A">Content Security Policy</text><text x="414" y="354" font-size="12" fill="#5B6472">script-src 'self' · connect-src 'none'</text><text x="414" y="371" font-size="12" fill="#5B6472">object-src 'none' · frame-ancestors 'none'</text>
<rect x="40" y="445" width="700" height="75" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="54" y="469" font-size="14" font-weight="650" fill="#0B1F3A">Data directory (user profile)</text><text x="54" y="489" font-size="12" fill="#5B6472">cortextrace.db · config.json · tokens.json · alerts.jsonl · logs/  (0600 on POSIX)</text>
<rect x="790" y="20" width="390" height="520" rx="14" fill="#F3F5F8"/><text x="806" y="44" font-size="12" font-weight="700" fill="#5B6472" letter-spacing="0.06em">RENDERER (SANDBOXED)</text>
<rect x="810" y="60" width="350" height="70" rx="10" fill="#FFFFFF" stroke="#1F5FAF" stroke-width="1.4"/><text x="824" y="84" font-size="14" font-weight="650" fill="#0B1F3A">Preload bridge</text><text x="824" y="104" font-size="12" fill="#5B6472">window.cortex.invoke / onStream / onNavigate</text>
<rect x="810" y="150" width="350" height="190" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="824" y="174" font-size="14" font-weight="650" fill="#0B1F3A">React dashboard</text><text x="824" y="194" font-size="12" fill="#5B6472">Overview · Live Activity · Threats · Timeline</text><text x="824" y="211" font-size="12" fill="#5B6472">Agents · Sessions · Relationships · Processes</text><text x="824" y="228" font-size="12" fill="#5B6472">Commands · Files · Tools · Network · MCP</text><text x="824" y="245" font-size="12" fill="#5B6472">Policies · Analytics · System Health · Settings</text><text x="824" y="262" font-size="12" fill="#5B6472">First-run onboarding</text>
<rect x="810" y="360" width="350" height="160" rx="10" fill="#FFFFFF" stroke="#CBD2DC" stroke-width="1.4"/><text x="824" y="384" font-size="14" font-weight="650" fill="#0B1F3A">UI foundations</text><text x="824" y="404" font-size="12" fill="#5B6472">virtualised event lists</text><text x="824" y="421" font-size="12" fill="#5B6472">SVG charts with hover tooltips</text><text x="824" y="438" font-size="12" fill="#5B6472">force-directed graph (d3-force)</text><text x="824" y="455" font-size="12" fill="#5B6472">light / dark themes · reduced motion</text>
<path d="M740,225  L810,95" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<path d="M810,115  L740,255" fill="none" stroke="#1F5FAF" stroke-width="1.6"  marker-end="url(#ahA)"/>
<path d="M210,170  L210,195" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
<path d="M570,170  L570,195" fill="none" stroke="#8A93A3" stroke-width="1.6"  marker-end="url(#ah)"/>
</svg>