name: Feature request
description: Suggest an adapter, detection rule or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to observe or protect? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
